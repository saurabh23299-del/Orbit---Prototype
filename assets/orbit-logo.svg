<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">Orbit logo</title>
  <desc id="desc">A minimal dark-olive circular mark with a tilted orbital ellipse and a four-point central sparkle, paired with the Orbit wordmark.</desc>
  <g transform="translate(30 20)" fill="none" stroke="#263321" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main circular form -->
    <circle cx="88" cy="90" r="66" stroke-width="7"/>
    <!-- Tilted orbital path -->
    <ellipse cx="88" cy="90" rx="49" ry="88" transform="rotate(-42 88 90)" stroke-width="7"/>
  </g>
  <!-- Four-point centre mark -->
  <path d="M118 78
           C118 98 111 105 91 105
           C111 105 118 112 118 132
           C118 112 125 105 145 105
           C125 105 118 98 118 78Z"
        fill="#263321"/>
  <!-- Wordmark -->
  <text x="220" y="151"
        font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif"
        font-size="112" font-weight="400" letter-spacing="-5"
        fill="#263321">Orbit</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>